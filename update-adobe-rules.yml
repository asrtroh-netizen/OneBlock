name: Update Adobe rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_adobe_rules.py
      - .github/workflows/update-adobe-rules.yml
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate full rule sets
        run: python update_adobe_rules.py

      - name: Commit updated rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adobe-block.json adobe-block.yaml adobe-block.txt metadata.json
          if git diff --cached --quiet; then
            echo "No rule changes"
            exit 0
          fi
          git commit -m "chore: update full Adobe rules"
          git push
